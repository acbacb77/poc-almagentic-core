# Cadena de suministro de la imagen (tarea 9).
#
#   publish: false (PRs)  → construye la imagen, la prueba arrancada y genera su SBOM.
#   publish: true  (main) → además la sube a GHCR, la firma con cosign (sin claves:
#                           certificado de Sigstore ligado a este workflow), adjunta
#                           las atestaciones de procedencia SLSA y de SBOM, y verifica
#                           todo antes de terminar.
#
# Las imágenes base del Dockerfile tienen que ir fijadas por digest. Si alguna no lo
# está, el job falla y la anotación indica el digest que hay que poner.
#
# Permisos: `build` solo lee. `publish` no declara permisos y hereda los del job que
# lo llama, que en main debe conceder packages, id-token y attestations (write); en
# los PRs no se ejecuta.
name: reusable-supply-chain

on:
  workflow_call:
    inputs:
      publish:
        description: Subir, firmar y atestiguar la imagen
        type: boolean
        default: false
      image:
        description: "Nombre de la imagen (por defecto ghcr.io/<owner>/<repo>)"
        type: string
        default: ""
      core-ref:
        description: Versión de poc-almagentic-core con los scripts
        type: string
        default: v1
    outputs:
      digest:
        description: Digest de la imagen publicada
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

env:
  SYFT_VERSION: v1.54.1
  SIGNER_WORKFLOW: acbacb77/poc-almagentic-core/.github/workflows/reusable-supply-chain.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.name.outputs.image }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts de core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: acbacb77/poc-almagentic-core
          ref: ${{ inputs.core-ref }}
          path: .core
          persist-credentials: false

      - name: Nombre de la imagen
        id: name
        env:
          IMAGE: ${{ inputs.image }}
          REPO: ${{ github.repository }}
        run: |
          name="${IMAGE:-ghcr.io/${REPO}}"
          echo "image=${name,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Imágenes base fijadas por digest
        run: |
          python3 .core/scripts/supply-chain/base_images.py Dockerfile > bases.tsv
          fail=0
          while IFS=$'\t' read -r image state; do
            if [ "$state" = fijada ]; then echo "Fijada: $image"; continue; fi
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
            echo "::error file=Dockerfile,title=Imagen base sin fijar::Fija ${image} por digest: ${image}@${digest}"
            fail=1
          done < bases.tsv
          exit "$fail"

      - name: Construir
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${TAG}" .

      - name: Prueba de humo (imagen arrancada, sistema de ficheros de solo lectura)
        env:
          REF: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
        run: |
          docker run -d --name app --read-only --tmpfs /tmp -p 8000:8000 "$REF"
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8000/health
          echo
          test "$(docker exec app id -u)" != 0 || { echo "::error::La imagen corre como root"; exit 1; }
          curl -fsS "localhost:8000/api/v1/productos?q=texto-secreto-de-prueba" > /dev/null
          sleep 1
          docker logs app > logs.txt 2>&1
          if grep -q "texto-secreto-de-prueba" logs.txt; then
            echo "::error::El texto de q aparece en los logs del contenedor (FR-011)"; cat logs.txt; exit 1
          fi
          echo "Logs sin el texto de q"
          docker rm -f app

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ steps.name.outputs.tag }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-release-assets: false

      - name: Resumen del SBOM
        run: |
          {
            echo "### SBOM de la imagen"
            echo
            echo "$(jq '.packages | length' sbom.spdx.json) paquetes."
            echo
            echo "| Paquete | Versión | Licencia |"
            echo "|---|---|---|"
            jq -r '.packages[] | select(.externalRefs[]?.referenceLocator | test("^pkg:pypi/")) | "| \(.name) | \(.versionInfo) | \(.licenseDeclared // "-") |"' sbom.spdx.json | sort -u
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar la imagen para publicarla
        if: inputs.publish
        env:
          REF: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
        run: docker save "$REF" -o imagen.tar

      - name: Imagen y SBOM para el job publish
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            imagen.tar
            sbom.spdx.json
          retention-days: 1

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Imagen y SBOM del job build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagen-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Subir a GHCR
        id: push
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -q -i imagen.tar
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:main"
          docker push -q "${IMAGE}:${TAG}"
          docker push -q "${IMAGE}:main"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Imagen publicada::${IMAGE}@${digest}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firmar con cosign (sin claves)
        env:
          REF: ${{ needs.build.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Atestación de procedencia (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Atestación del SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verificar firma y atestaciones
        env:
          REF: ${{ needs.build.outputs.image }}@${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${SIGNER_WORKFLOW}@" > /dev/null
          echo "Firma de cosign verificada: la firmó ${SIGNER_WORKFLOW}"
          gh attestation verify "oci://${REF}" --owner "$OWNER" --signer-workflow "$SIGNER_WORKFLOW" > /dev/null
          echo "Procedencia SLSA verificada"
          gh attestation verify "oci://${REF}" --owner "$OWNER" --signer-workflow "$SIGNER_WORKFLOW" \
            --predicate-type https://spdx.dev/Document/v2.3 > /dev/null
          echo "SBOM verificado"
          {
            echo "### Imagen publicada"
            echo
            echo "\`${REF}\`"
            echo
            echo "Firmada con cosign y con atestaciones de procedencia y SBOM, todo verificado contra \`${SIGNER_WORKFLOW}\`."
          } >> "$GITHUB_STEP_SUMMARY"
