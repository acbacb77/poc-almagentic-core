# Evals del harness de los agentes sin herramientas: triage y revisor (tarea C).
#
# Antes de cambiar el modelo de un agente, se lanzan los mismos casos con el modelo actual
# y con el candidato. Cada caso pasa por los scripts reales (prompt, llamada sin
# herramientas con esquema JSON y validador), así que se evalúa la cadena completa.
# Casos en evals/, script en scripts/evals/run_evals.py. No escribe en ningún repo.
name: reusable-evals

on:
  workflow_call:
    inputs:
      modelos:
        description: Modelos a comparar, separados por comas (p. ej. "sonnet,haiku")
        type: string
        default: sonnet
      agente:
        description: "triage, revisor o vacío para los dos"
        type: string
        default: ""
      repeticiones:
        description: Veces que se repite cada caso (mide la estabilidad)
        type: number
        default: 1
      min-acierto:
        description: Acierto mínimo para dar el job por bueno (0 a 1)
        type: string
        default: "1.0"
      core-ref:
        description: Versión de poc-almagentic-core con los casos y el script
        type: string
        default: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Token de `claude setup-token` (suscripción Claude)
        required: true

env:
  CLAUDE_CODE_VERSION: "2.1.296"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      modelos: ${{ steps.m.outputs.modelos }}
    steps:
      - id: m
        env:
          MODELOS: ${{ inputs.modelos }}
        run: |
          json=$(python3 -c 'import json,os,re,sys
          m=[x.strip() for x in os.environ["MODELOS"].split(",") if x.strip()]
          bad=[x for x in m if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", x)]
          sys.exit(f"Modelo no válido: {bad}") if bad or not m else print(json.dumps(m))')
          echo "modelos=$json" >> "$GITHUB_OUTPUT"

  evals:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        modelo: ${{ fromJSON(needs.plan.outputs.modelos) }}
    name: evals (${{ matrix.modelo }})
    steps:
      - name: Casos y scripts de core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: acbacb77/poc-almagentic-core
          ref: ${{ inputs.core-ref }}
          path: core
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Ejecutar los casos
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODELO: ${{ matrix.modelo }}
          AGENTE: ${{ inputs.agente }}
          REPETICIONES: ${{ inputs.repeticiones }}
          MIN: ${{ inputs.min-acierto }}
        run: |
          set +e
          python3 core/scripts/evals/run_evals.py --model "$MODELO" --out resultados \
            ${AGENTE:+--agente "$AGENTE"} --repeticiones "$REPETICIONES" --min-acierto "$MIN"
          code=$?
          cat resultados/informe.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit "$code"

      - name: Guardar respuestas e informe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.modelo }}-${{ github.run_id }}
          path: resultados/
          retention-days: 90
          if-no-files-found: ignore
