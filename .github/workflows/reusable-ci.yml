# CI reutilizable (tarea 6): valida cada PR de un repo de aplicación en una máquina limpia.
# El repo que lo llama solo decide cuándo; qué se comprueba lo decide core, al que el agente no tiene acceso.
#
#   jobs:
#     ci:
#       permissions: { contents: read }
#       uses: acbacb77/poc-almagentic-core/.github/workflows/reusable-ci.yml@v1
#
# Requisitos del repo que lo llama: pyproject.toml y uv.lock en la raíz, tests con pytest,
# ruff y mypy como dependencias de desarrollo.
name: reusable-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: Versión de Python
        type: string
        default: "3.12"
      source-dir:
        description: Carpeta que revisa mypy
        type: string
        default: src

permissions: {}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Código del PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv y Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Dependencias exactas de uv.lock
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: uv run mypy "$SOURCE_DIR"
