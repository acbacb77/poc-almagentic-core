# Tests propios de core: hook del harness y scripts del triage, de seguridad y del agente.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Hook, triage, seguridad, agentes, cadena, promoción, versiones y evals
        run: |
          uvx --with pytest==9.1.1 pytest -q agent-standards/hooks scripts/triage
          (cd scripts/security && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/agent && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/supply-chain && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/promote && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/release && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/evals && uvx --with pytest==9.1.1 pytest -q)
          bash -n scripts/promote/verify_image.sh
