# Tests propios de core: hook del harness y scripts del triage, de seguridad y del agente.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Hook, triage, seguridad y agente
        run: |
          uvx --with pytest==9.1.1 pytest -q agent-standards/hooks scripts/triage
          (cd scripts/security && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/agent && uvx --with pytest==9.1.1 pytest -q)
          (cd scripts/supply-chain && uvx --with pytest==9.1.1 pytest -q)
